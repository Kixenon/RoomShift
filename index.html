<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f3" />
    <title>RoomShift</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="editor-layout" id="editor-layout">
      <aside class="asset-rail" id="asset-rail" aria-label="Asset tools">
        <button id="toggle-asset-rail" class="panel-toggle" type="button" aria-controls="asset-items" aria-expanded="true" aria-label="Collapse asset menu" title="Collapse asset menu">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6" /></svg>
        </button>
        <div class="asset-items" id="asset-items">
          <button class="asset-button" id="add-object" type="button" aria-label="Add object" title="Add object">
            <span class="asset-glyph">□</span><span>Object</span>
          </button>
          <button class="asset-button" id="add-fan" type="button" aria-label="Add fan" title="Add fan">
            <span class="asset-glyph">✳</span><span>Fan</span>
          </button>
          <button class="asset-button" id="add-ceiling-fan" type="button" aria-label="Add ceiling fan with light" title="Add ceiling fan with light">
            <span class="asset-glyph">✣</span><span>Ceiling fan</span>
          </button>
          <button class="asset-button" id="add-heater" type="button" aria-label="Add heater" title="Add heater">
            <span class="asset-glyph">▥</span><span>Heater</span>
          </button>
          <button class="asset-button" id="add-air-conditioner" type="button" aria-label="Add air conditioner" title="Add wall air conditioner">
            <span class="asset-glyph">❄</span><span>Air con</span>
          </button>
          <button class="asset-button" id="add-lamp" type="button" aria-label="Add lamp" title="Add lamp">
            <span class="asset-glyph">◉</span><span>Lamp</span>
          </button>
          <button class="asset-button" id="add-router" type="button" aria-label="Add router" title="Add router">
            <span class="asset-glyph">⌁</span><span>Router</span>
          </button>
          <button class="asset-button" id="add-window" type="button" aria-label="Add window" title="Add window">
            <span class="asset-glyph">▣</span><span>Window</span>
          </button>
          <button class="asset-button" id="add-door" type="button" aria-label="Add door" title="Add door">
            <span class="asset-glyph">▯</span><span>Door</span>
          </button>
        </div>
      </aside>

      <section class="viewport-wrap" aria-label="3D room">
        <div class="viewport-topline">
          <div class="simulation-controls">
            <div class="field-controls" role="group" aria-label="Simulation and lighting views">
              <button id="show-airflow" class="field-button" type="button" aria-label="Airflow mode" title="Airflow" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11a2.5 2.5 0 1 0-2.3-3.5M2 12h17a2.5 2.5 0 1 1-2.3 3.5M4 17h9" /></svg>
              </button>
              <button id="show-temperature" class="field-button" type="button" aria-label="Heat mode" title="Heat" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14.7V5a3 3 0 1 1 6 0v9.7a5 5 0 1 1-6 0Z" /><path d="M12 17V7" /></svg>
              </button>
              <button id="show-light" class="field-button" type="button" aria-label="Light mode" title="Light" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v3m0 14v3M4.9 4.9 7 7m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1" /></svg>
              </button>
              <button id="show-wifi" class="field-button" type="button" aria-label="Wi-Fi coverage mode" title="Wi-Fi coverage" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0" /><circle cx="12" cy="20" r="1.05" fill="currentColor" stroke="none" /></svg>
              </button>
              <details id="field-display-control" class="field-display-control" hidden>
                <summary id="field-display-button" aria-haspopup="menu" aria-expanded="false" title="Choose view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg><span id="field-display-label" class="sr-only">View</span></summary>
                <div id="field-display-menu" class="field-display-menu" role="menu" aria-label="Mode view options"></div>
              </details>
            </div>
            <details id="slice-height-control" class="slice-height-control" hidden>
              <summary id="slice-height-summary">Slice · 1.20 m</summary>
              <div class="parameter-menu slice-height-menu">
                <input id="slice-height" type="range" min="0" max="2.7" step="0.05" value="1.2" aria-label="Simulation slice height in meters" />
                <output id="slice-height-value">1.20 m</output>
              </div>
            </details>
            <span id="editor-status" class="editor-status" aria-live="polite"></span>
          </div>
          <div class="viewport-info">
            <button id="show-shortcuts" class="tool-button info-button" type="button" aria-label="Show keyboard shortcuts and help" aria-haspopup="true" aria-expanded="false" aria-controls="shortcut-help" title="Info">i</button>
            <section id="shortcut-help" class="shortcut-help" aria-label="Keyboard shortcuts and help" hidden>
              <div class="shortcut-heading">Shortcuts</div>
              <div><span>Undo</span><kbd>⌘ Z / Ctrl Z</kbd></div>
              <div><span>Redo</span><kbd>⌘ ⇧ Z / Ctrl Y</kbd></div>
              <div><span>Move / rotate</span><kbd>G / R</kbd></div>
              <div><span>Toggle projection</span><kbd>O</kbd></div>
              <div><span>Delete selection</span><kbd>⌫ / Delete</kbd></div>
              <p>Drag to orbit · scroll to zoom</p>
            </section>
          </div>
        </div>
        <div id="viewport" class="viewport">
          <div class="field-legend" id="field-legend" hidden aria-label="Simulation map legend">
            <span id="field-legend-title" class="field-legend-title"></span>
            <span id="field-gradient" class="field-gradient" aria-hidden="true"></span>
            <span class="field-gradient-labels"><span id="field-legend-min"></span><span id="field-legend-max"></span></span>
          </div>
          <span id="field-loading" class="field-loading" role="status" hidden></span>
          <div class="camera-controls" role="group" aria-label="Camera controls">
            <button id="transform-mode-toggle" class="tool-button camera-button" type="button" data-mode="translate" aria-label="Move mode" aria-pressed="false" title="Move mode (G); click to rotate">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <g class="move-mode-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3" />
                </g>
                <g class="rotate-mode-icon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 8a7 7 0 1 0 1 4M19 4v5h-5" />
                </g>
              </svg>
            </button>
            <span class="tool-separator"></span>
            <button id="toggle-projection" class="tool-button camera-button" type="button" data-projection="perspective" aria-label="Toggle projection" aria-pressed="false" title="Toggle projection (O)">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <g class="projection-perspective-icon" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.5 4.5h13v11h-13zM10 10 4.2 5m5.8 5 5.8-5M10 10v5.5" />
                  <circle cx="10" cy="10" r="1" fill="currentColor" stroke="none" />
                </g>
                <g class="projection-orthographic-icon" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m10 2.7 6.1 3.5v7.6L10 17.3l-6.1-3.5V6.2L10 2.7zM3.9 6.2 10 9.7l6.1-3.5M10 9.7v7.6" />
                </g>
              </svg>
            </button>
            <span class="tool-separator"></span>
            <details id="camera-view-picker" class="camera-view-picker">
              <summary id="camera-view-picker-button" class="tool-button camera-button" aria-label="Choose camera view" aria-haspopup="menu" aria-expanded="false" title="Choose camera view">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 3 6 3.4v7.2L10 17l-6-3.4V6.4L10 3zM4 6.4l6 3.4 6-3.4M10 9.8V17m-3-11.8h6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="m7.2 11.8 2.8 2.6 2.8-2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </summary>
              <div id="camera-view-menu" class="camera-view-menu" role="menu" aria-label="Camera view">
                <button id="camera-view-3d" class="camera-view-option" type="button" role="menuitemradio" data-camera-view="3d" aria-checked="true">3D view</button>
                <button id="camera-view-top" class="camera-view-option" type="button" role="menuitemradio" data-camera-view="top" aria-checked="false">Top view</button>
              </div>
            </details>
          </div>
        </div>
      </section>

      <aside class="inspector" aria-label="Room and object properties">
        <div class="inspector-control-row">
          <button id="toggle-inspector" class="panel-toggle" type="button" aria-controls="inspector-content" aria-expanded="true" aria-label="Collapse properties menu" title="Collapse properties menu">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6" /></svg>
          </button>
        </div>
        <div class="inspector-content" id="inspector-content">
          <section class="inspector-section room-section">
            <div class="section-heading"><span>Room</span><details id="scenario-storage" class="room-actions field-display-control">
              <summary class="tool-button" aria-label="Room actions" title="Room actions" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></summary>
              <div class="field-display-menu" role="menu" aria-label="Room actions">
                <input id="scenario-name" maxlength="80" placeholder="Name" aria-label="Scenario name" />
                <button id="save-scenario" class="field-display-option" type="button" role="menuitem">Save</button>
                <select id="saved-scenarios" aria-label="Saved scenarios"><option value="">Choose saved…</option></select>
                <button id="load-scenario" class="field-display-option" type="button" role="menuitem">Load</button>
                <button id="delete-scenario" class="field-display-option" type="button" role="menuitem">Delete</button>
                <button id="reset-room" class="field-display-option" type="button" role="menuitem">Reset room</button>

              </div>
            </details></div>
            <div class="dimension-fields">
              <label class="field"><span>Width</span><input id="room-width" aria-label="Room width in meters" type="number" min="2" max="20" step="0.1" value="5.2" /></label>
              <label class="field"><span>Depth</span><input id="room-depth" aria-label="Room depth in meters" type="number" min="2" max="20" step="0.1" value="4" /></label>
              <label class="field"><span>Height</span><input id="room-height" aria-label="Room height in meters" type="number" min="2" max="6" step="0.1" value="2.7" /></label>
            </div>
            <label class="field outdoor-temperature-field"><span>Outside</span><input id="outdoor-temperature" aria-label="Outdoor temperature in degrees Celsius" type="number" min="-20" max="50" step="1" value="10" required /><span>°C</span></label>
            <details id="room-daylight-control" class="room-daylight-control" hidden>
              <summary><span>Time of day</span><output id="clock-label">13:30</output></summary>
              <div class="parameter-menu room-daylight-menu">
                <label class="field"><span>Date</span><input id="daylight-date" type="date" value="2026-03-21" aria-label="Daylight date" /></label>
                <label class="field"><span>Room heading · °</span><input id="room-heading" type="number" min="0" max="360" value="0" aria-label="Room heading clockwise from north" /></label>
                <input id="time-of-day" type="range" min="0" max="1439" step="5" value="810" aria-label="Time of day" />
              </div>
            </details>
          </section>

          <section class="inspector-section simulation-section" id="simulation-settings" hidden aria-label="Simulation controls">
            <div class="simulation-timeline">
              <button id="simulation-play" class="tool-button" type="button" title="Play simulation" aria-label="Play simulation" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 10 7-10 7Z"/></svg></button>
              <input id="simulation-time" type="range" min="0" max="120" step="0.5" value="3" aria-label="Elapsed simulation time in seconds" />
              <output id="simulation-time-value" title="Elapsed simulation time">3 s</output>
              <button id="simulation-restart" class="tool-button" type="button" title="Restart simulation" aria-label="Restart simulation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
              <details id="resolution-control" class="simulation-popover field-display-control"><summary class="tool-button" title="Simulation detail" aria-label="Simulation detail" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></summary>
                <div class="field-display-menu" role="menu" aria-label="Simulation detail">
                  <button class="field-display-option" type="button" role="menuitemradio" data-resolution="0.25" aria-checked="false">Quick</button>
                  <button class="field-display-option" type="button" role="menuitemradio" data-resolution="0.15" aria-checked="true">Standard</button>
                  <button class="field-display-option" type="button" role="menuitemradio" data-resolution="0.075" aria-checked="false">Fine</button>
                  <hr />
            <label class="field outdoor-temperature-field"><span>Initial air</span><input id="initial-temperature" type="number" min="-20" max="40" step="1" value="20" aria-label="Initial room air temperature" /><span>°C</span></label>
            <label class="field outdoor-temperature-field"><span>Envelope U</span><input id="envelope-u-value" type="number" min="0" max="5" step="0.1" value="0.7" aria-label="Envelope heat transfer coefficient" title="Overall wall, floor, and ceiling heat transfer in W/(m² K). Zero means insulated. Wall heat storage is not modeled." /></label>
                </div>
              </details>

              <details id="scale-control" class="simulation-popover field-display-control"><summary class="tool-button" title="Temperature scale" aria-label="Temperature scale" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12M6 19h12M12 5v14m-3-3 3 3 3-3M9 8l3-3 3 3"/></svg></summary>
                <div class="parameter-menu"><div class="dimension-fields"><label class="field"><span>Min °C</span><input id="temperature-min" type="number" min="-20" max="59" value="10" /></label><label class="field"><span>Max °C</span><input id="temperature-max" type="number" min="-19" max="60" value="30" /></label></div></div>
              </details>

            </div>
          </section>

          <section class="inspector-section object-list-section">
            <div class="section-heading"><span>Objects</span></div>
            <div id="object-list" class="object-list"></div>
          </section>

          <section class="inspector-section properties-section" id="properties-section">
            <div class="section-heading"><span>Selection</span><button id="delete-object" class="delete-button" type="button" aria-label="Delete selected object" title="Delete selected object" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 6h11m-9.5 0 .6 10h7.8l.6-10M8 6V4h4v2m-3 3v4m2-4v4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
            <div id="object-properties" class="empty-properties">Select an object</div>
          </section>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
